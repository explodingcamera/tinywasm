[package]
name = "tinywasm-doom"
edition = "2024"
publish = false

# treat this as an independent package
[workspace]

[dependencies]
eyre = "0.6"
log = "0.4"
pretty_env_logger = "0.5"
softbuffer = "0.4"
tinywasm = { path = "../../crates/tinywasm", features = [
  "archive",
  "canonicalize-nans",
  "debug",
  "log",
  "parallel-parser",
  "parser",
  "std",
] }
winit = "0.30"
