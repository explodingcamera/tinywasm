name: Audit dependencies

on:
  pull_request:
    paths:
      - ".github/workflows/audit.yaml"
      - "**/Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main, next]
    paths:
      - ".github/workflows/audit.yaml"
      - "**/Cargo.toml"
      - "Cargo.lock"
  schedule:
    # Every Monday at 12:30 UTC
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      runs-on: ubuntu-26.04
      upload-sarif: false
      scan-args: --lockfile=./Cargo.lock

  scan:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      runs-on: ubuntu-26.04
      fail-on-vuln: false
      scan-args: --lockfile=./Cargo.lock
