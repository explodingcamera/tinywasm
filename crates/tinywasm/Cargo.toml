[package]
name = "tinywasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A tiny WebAssembly interpreter"
readme = "../../README.md"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
features = ["std", "validate", "parser", "archive", "log", "canonicalize-nans", "debug", "guest-debug"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "tinywasm"
path = "src/lib.rs"

[[test]]
harness = false
name = "test-wasm-1"

[[test]]
harness = false
name = "test-wasm-3"

[[test]]
harness = false
name = "test-wasm-2"

[[test]]
harness = false
name = "test-wasm-latest"

[[test]]
harness = false
name = "test-wasm-multi-memory"

[[test]]
harness = false
name = "test-wasm-threads"
test = false

[[test]]
harness = false
name = "test-wast"
test = false

[[test]]
harness = false
name = "test-wasm-custom-page-sizes"

[[test]]
harness = false
name = "test-wasm-custom"

[[test]]
harness = false
name = "test-wasm-gc"

[[test]]
harness = false
name = "test-wasm-memory64"

[[test]]
harness = false
name = "test-wasm-relaxed-simd"

[[test]]
harness = false
name = "test-wasm-simd"

[[test]]
harness = false
name = "test-wasm-wide-arithmetic"

[dependencies]
libm = { version = "0.2", default-features = false }
log = { workspace = true, optional = true }
portable-atomic = { version = "1.15.0", default-features = false, optional = true }
tinywasm-parser = { workspace = true, optional = true }
tinywasm-types = { workspace = true }

[dev-dependencies]
tinywasm-cli = { path = "../cli", features = ["tests", "wat"] }
wasm-testsuite.workspace = true
wat.workspace = true

[features]
default = ["full", "std"]
full = ["archive", "parallel-parser", "parser", "validate"]

log = ["dep:log", "tinywasm-parser?/log", "tinywasm-types/log"]
std = ["tinywasm-parser?/std", "tinywasm-types/std"]

# make stores, instances, references, and host callbacks movable across threads
send = []

# support for parsing WebAssembly
parser = ["dep:tinywasm-parser"]

# validate WebAssembly while parsing
validate = ["tinywasm-parser?/validate"]

# parallelize function parsing/validation across threads (requires std)
parallel-parser = ["tinywasm-parser?/parallel"]

# support targets without native atomic CAS
portable-atomic = ["dep:portable-atomic", "tinywasm-parser?/portable-atomic", "tinywasm-types/portable-atomic"]

# support for "archiving" tinywasm bytecode
archive = ["tinywasm-types/archive"]

# canonicalize all NaN values to a single representation
canonicalize-nans = []

# derive Debug for runtime/types structs
debug = ["tinywasm-types/debug"]

# expose module-internal by-index inspection APIs for non-exported entities (for testing and debugging)
guest-debug = []

# enable x86-specific SIMD intrinsics in Value128 (uses unsafe code)
# note: for x86 backend selection, compile with x86-64-v3 target features
# (for example: `RUSTFLAGS="-C target-cpu=x86-64-v3"`)
simd-x86 = []
